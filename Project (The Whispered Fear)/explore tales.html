}



.city-section:hover {
    background-color: rgba(0, 0, 0, 0.677);
}

.city-title {

}

.story-content {
    display: none;
    padding-top: 10px;
    color: #eee;
    text-align: left;
}

@keyframes flicker {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.8; }
}

@keyframes textGlow {
    0%, 100% { text-shadow: 0 0 10px #cc3333; }
    50% { text-shadow: 0 0 20px #ff6666; }
}
